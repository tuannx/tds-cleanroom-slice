<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0c12">
  <title>Clean-room slice</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%230a0c12'/><rect x='5' y='4' width='6' height='4' fill='%234d6b8c'/><rect x='4' y='8' width='8' height='2' fill='%237b8aa3'/><rect x='2' y='10' width='12' height='3' fill='%23232b3a'/></svg>">
  <style>
    :root {
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #0a0c12;
      color: #6f7a8d;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 18px;
      overflow: hidden;
    }

    .row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 14px;
      width: min(100%, 960px, calc((100vh - 130px) * 4 / 3));
    }

    .brand {
      color: #cfd6e4;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .keys {
      color: #5c6678;
      white-space: nowrap;
    }

    #stage {
      position: relative;
      width: min(100%, 960px, calc((100vh - 130px) * 4 / 3));
      aspect-ratio: 4 / 3;
      border-radius: 12px;
      overflow: hidden;
      background: #0f131b;
      box-shadow: 0 18px 60px rgba(0, 0, 0, .6), 0 0 0 1px #1c2433;
      touch-action: manipulation;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }

    #veil {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #7f8ba3;
      background: #0f131b;
      transition: opacity .25s ease;
    }

    #veil.gone {
      opacity: 0;
      pointer-events: none;
    }

    #play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 20px;
      color: #cfd6e4;
      font-size: 13px;
      letter-spacing: .04em;
      background: rgba(10, 12, 18, .55);
      cursor: pointer;
      transition: opacity .2s ease;
    }

    #play.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #play small {
      display: block;
      margin-top: 8px;
      color: #6f7a8d;
      font-size: 11px;
      letter-spacing: .02em;
    }

    #note {
      width: min(100%, 960px, calc((100vh - 130px) * 4 / 3));
      text-align: center;
      color: #495263;
    }

    @media (max-width: 560px) {
      .keys {
        display: none;
      }
    }
  </style>
</head>

<body>
  <div class="row">
    <span class="brand">CLEAN-ROOM SLICE</span>
    <span class="keys">SPACE buy &middot; E upgrade &middot; ENTER wave &middot; R restart</span>
  </div>

  <div id="stage">
    <canvas id="glcanvas" tabindex="0"></canvas>
    <div id="veil">loading&hellip;</div>
    <div id="play">click to play<small>SPACE buy &middot; E upgrade &middot; ENTER wave &middot; R restart</small></div>
  </div>

  <div id="note">placeholder art &middot; no original asset &middot; balance is a placeholder</div>

  <script src="mq_js_bundle.js"></script>
  <script>
    (function () {
      const el = document.getElementById("glcanvas");
      const veil = document.getElementById("veil");
      const play = document.getElementById("play");

      const hidePlay = () => play.classList.add("hidden");
      el.addEventListener("pointerdown", hidePlay, { once: true });
      addEventListener("keydown", hidePlay, { once: true });

      el.addEventListener("pointerdown", () => el.focus());
      el.focus();

      // Keep the browser page from scrolling while the game has focus.
      addEventListener("keydown", (e) => {
        if (["Space", "ArrowUp", "ArrowDown"].includes(e.code)) e.preventDefault();
      });

      // No original assets and no CDN: the whole game is tds.wasm + this glue.
      load("tds.wasm");
      setTimeout(() => veil.classList.add("gone"), 450);
    })();
  </script>
</body>

</html>
